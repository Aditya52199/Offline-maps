name: my_offline_gps
description: An offline AI GPS application.
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.0
  flutter_map_mbtiles: ^1.0.0
  sqlite3_flutter_libs: ^0.5.0
  geolocator: ^13.0.0
  latlong2: ^0.9.0
  tflite_flutter: ^0.11.0
  sqflite: ^2.3.0
  ffi: ^2.1.2
  path: ^1.9.0
  flutter_map_cancellable_tile_provider: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/
    - assets/models/
    - assets/routing/